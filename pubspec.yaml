name: bounce_ball_two
description: "Bounce Ball 2 — neon plinko ball game with risk and reward."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flame: ^1.37.0
  video_player: ^2.11.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1

  # ── Gray gate layer ───────────────────────────────────────
  appsflyer_sdk: ^6.15.0
  app_tracking_transparency: ^2.0.3
  firebase_core: ^3.12.0
  firebase_messaging: ^15.1.0
  firebase_app_check: ^0.3.1+5
  flutter_local_notifications: ^17.0.0
  connectivity_plus: ^6.1.2
  http: ^1.2.1
  device_info_plus: ^9.1.0
  flutter_secure_storage: ^9.2.1
  package_info_plus: ^8.0.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  webview_flutter_wkwebview: ^3.18.0
  file_picker: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.jpg"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/logo.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Disable Swift Package Manager — use CocoaPods to prevent SPM
  # from modifying project.pbxproj after pod install in CI.
  config:
    enable-swift-package-manager: false

  assets:
    - assets/logo.jpg
    - assets/game_assets/
    - assets/Loading/
    - assets/Notifications/
    - assets/NoWifi/
